[package]
name = "sarscov2-graph"
version = "0.1.0"
edition = "2021"
description = "SARS-CoV-2 3D Knowledge Graph implementation"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = "0.6"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
approx = "0.5"
