[package]
name = "sarscov2-urm-hybrid"
version = "2.4.2"
edition = "2026"
authors = ["Nurcholish Adam <nurcholisdam@gmail.com>"]
description = "Hybrid Universal Reasoning Model for SARS-CoV-2 Knowledge Graph with LIMIT-GRAPH v2.4.2 integration"
license = "MIT"
repository = "https://github.com/NurcholishAdam/sarscov2-urm-hybrid"
keywords = ["sars-cov-2", "knowledge-graph", "urm", "quantum", "limit-graph"]
categories = ["science", "algorithms"]
readme = "README.md"

[[bin]]
name = "sarscov2-urm-hybrid"
path = "src/main.rs"

[workspace]
members = [
    "crates/urm-core",
    "crates/sarscov2-graph",
    "crates/limit-integration",
    "crates/confucius-agent",
    "crates/quantum-reasoning",
]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
urm-core = { path = "crates/urm-core" }
sarscov2-graph = { path = "crates/sarscov2-graph" }
limit-integration = { path = "crates/limit-integration" }
confucius-agent = { path = "crates/confucius-agent" }
quantum-reasoning = { path = "crates/quantum-reasoning" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "urm_benchmarks"
harness = false
